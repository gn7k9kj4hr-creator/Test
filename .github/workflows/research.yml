name: Run AI Trading Research

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * 1-5'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Run real-market-data four-agent paper arena
        run: python -m engine.arena_controller

      - name: Verify arena report
        run: |
          test -s reports/arena_state.json
          python - <<'PY'
          import json
          r=json.load(open('reports/arena_state.json'))
          assert r.get('mode') == 'DRY_RUN'
          assert len(r.get('agents', [])) == 4
          print('Four-agent paper arena verified')
          for a in r['agents']:
              s=a.get('selection') or {}
              print(a['agent'], s.get('symbol'), s.get('decision'))
          PY

      - name: Publish paper-arena report
        run: |
          mkdir -p app/reports
          cp reports/arena_state.json app/reports/arena.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/reports/arena.json
          if git diff --cached --quiet; then
            echo 'No arena report changes to publish.'
          else
            git commit -m 'Update four-agent paper arena'
            git push
          fi
