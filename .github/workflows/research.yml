name: Keyless Market Research

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: paper-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies with retries
        shell: bash
        run: |
          set -e
          for attempt in {1..10}; do
            echo "Dependency install attempt $attempt/10"
            python -m pip install --upgrade pip setuptools wheel && \
            python -m pip install --only-binary=:all: 'numpy==1.26.4' 'pandas==2.1.1' 'requests==2.31.0' && break
            if [ "$attempt" -eq 10 ]; then exit 1; fi
            sleep 10
          done
      - name: Run four-agent research with retries
        shell: bash
        run: |
          set -u
          for attempt in {1..10}; do
            echo "Research attempt $attempt/10"
            rm -f reports/latest.json reports/status.json
            if python research_run.py; then
              echo "Research completed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Research failed after 10 attempts"
              exit 1
            fi
            sleep 15
          done
      - name: Verify real report
        shell: bash
        run: |
          test -s reports/latest.json
          test -s reports/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/latest.json').read_text())
          assert r.get('mode') == 'PAPER_ONLY', f"Unexpected mode: {r.get('mode')}"
          assert r.get('paper_budget') == 20.0, f"Unexpected paper budget: {r.get('paper_budget')}"
          source = r.get('data_source', '')
          assert 'keyless' in source.lower() or 'http' in source.lower() or 'market' in source.lower(), f"Unexpected data source: {source}"
          assert len(r.get('agents', [])) == 4, f"Expected 4 agents, got {len(r.get('agents', []))}"
          assert len(r.get('market', [])) > 0, 'No market records'
          assert len(r.get('candidates', [])) > 0, 'No research candidates'
          assert all('hypothetical_shares' in x for x in r['candidates']), 'Missing $20 position sizing'
          print(f"PASS: {len(r['agents'])} agents, {len(r['market'])} market records, {len(r['candidates'])} candidates, source={source}")
          PY
      - name: Publish report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/status.json
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Update keyless market research report'
            git push
          fi
