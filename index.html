<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>AI Trading Lab</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{padding:24px 18px 16px;background:#0b1627;border-bottom:1px solid #ffffff12}main{max-width:960px;margin:auto;padding:14px}.ey{font-size:11px;color:#70d7ff;font-weight:800;letter-spacing:.15em}.title{font-size:29px;font-weight:850;margin:5px 0}.sub,.muted{color:#91a4bd;font-size:13px}.status{margin:12px 0;padding:14px;border-radius:18px;background:#102238;border:1px solid #ffffff10}.agents{display:grid;grid-template-columns:1fr 1fr;gap:10px}.agent,.card{background:#101d2e;border:1px solid #ffffff10;border-radius:18px;padding:15px;margin:10px 0}.cash{font-size:24px;font-weight:800;margin:7px 0}.analysts{display:flex;gap:6px;margin-top:12px}.analyst{flex:1;background:#091522;padding:9px;border-radius:10px;font-size:10px}.good{color:#6ee7a0}.warn{color:#f4cf63}.bad{color:#ff8585}.table{overflow:auto}table{width:100%;min-width:700px;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #ffffff0c}th{color:#8397b2}.empty{text-align:center;color:#8397b2;padding:20px}.discussion{display:grid;gap:8px}.msg{background:#091522;border-radius:12px;padding:10px}.role{font-size:10px;color:#70d7ff;font-weight:800}.text{font-size:12px;margin-top:4px;line-height:1.45}@media(min-width:700px){.agents{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="ey">AI TRADING LAB</div><div class="title">Four-Agent Paper Arena</div><div class="sub">Keyless real-market research · simulated decisions · no live orders</div></header><main><div class="status"><b id="status">Loading research…</b><div class="sub" id="meta">Fetching latest report</div></div><section class="agents" id="agents"></section><section class="card"><b>Current decisions</b><div class="table"><table><thead><tr><th>Agent</th><th>Candidate</th><th>Status</th><th>Price</th><th>Score</th><th>20d return</th><th>Analysts</th></tr></thead><tbody id="table"><tr><td colspan="7" class="empty">Waiting for data…</td></tr></tbody></table></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:10px"><b>AI discussion</b><span class="muted">Latest run</span></div><div class="discussion" id="discussion" style="margin-top:10px"></div></section></main><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('reports/latest.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No report');const d=await r.json();const agents=d.agents||[];document.getElementById('status').innerHTML='<span class="good">● Research online</span>';document.getElementById('meta').textContent=`${d.market?.length||0} market records · ${new Date(d.generated_at).toLocaleString()} · ${d.data_source}`;document.getElementById('agents').innerHTML=agents.map((a,i)=>{const s=a.selection||{};return `<div class="agent"><b>Agent ${i+1}</b><div class="muted">${esc(a.strategy)}</div><div class="cash">$${Number(a.virtual_cash||25).toFixed(2)}</div><div class="${a.decision==='PAPER BUY'?'good':'warn'}"><b>${esc(a.decision)}</b></div><div class="analysts"><div class="analyst">Analyst A<br><b>${esc(a.analysts?.['Analyst A']||'—')}</b></div><div class="analyst">Analyst B<br><b>${esc(a.analysts?.['Analyst B']||'—')}</b></div></div></div>`}).join('');document.getElementById('table').innerHTML=agents.map((a,i)=>{const s=a.selection||{};return `<tr><td><b>Agent ${i+1}</b></td><td>${esc(s.symbol||'—')}</td><td class="${a.decision==='PAPER BUY'?'good':'warn'}"><b>${esc(a.decision)}</b></td><td>${s.price?'$'+Number(s.price).toFixed(2):'—'}</td><td>${s.score??'—'}</td><td>${s.return_20d_pct??'—'}%</td><td>${a.analysts?.['Analyst A']==='PASS'&&a.analysts?.['Analyst B']==='PASS'?'2/2':'Review'}</td></tr>`}).join('');document.getElementById('discussion').innerHTML=agents.flatMap(a=>(a.discussion||[]).map((m,j)=>`<div class="msg"><div class="role">Agent ${a.agent} · ${j===0?'LEAD':j===1?'ANALYST A':j===2?'ANALYST B':'LEAD'}</div><div class="text">${esc(m)}</div></div>`)).join('')||'<div class="empty">No discussion yet.</div>'}catch(e){document.getElementById('status').innerHTML='<span class="bad">● No research report yet</span>';document.getElementById('meta').textContent='Run the GitHub Actions workflow once to generate the first report.'}}load();setInterval(load,60000);</script></body></html>
